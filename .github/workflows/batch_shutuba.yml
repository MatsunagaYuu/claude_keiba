# 注意: Actionsスケジュールとローカル ./batch_shutuba.sh が両方 main に push すると
# 実行タイミングが重なり競合する（2026-07-09に発生）。出馬表バッチはローカル運用に一本化する。
# 2026-07-09 スケジュール実行を無効化（手動dispatchのみ残置）
name: Batch Shutuba (手動のみ・通常はローカル運用)

on:
  workflow_dispatch:
    inputs:
      use_cache:
        description: 'race_indexキャッシュを使用する（馬歴表示）'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: race_index キャッシュ復元（馬歴表示用）
        if: ${{ github.event_name == 'schedule' || inputs.use_cache != false }}
        uses: actions/cache/restore@v4
        with:
          path: race_index
          key: race-index-latest
          restore-keys: |
            race-index-

      - name: race_index存在チェック（劣化データpush防止）
        run: |
          count=$(ls race_index/*.csv 2>/dev/null | wc -l | tr -d ' ')
          echo "race_index files: $count"
          if [ "$count" -lt 1000 ]; then
            echo "ERROR: race_indexが不足しています ($count files)。キャッシュ復元に失敗している可能性があります。"
            echo "馬歴なしで上書きしないよう中断します。"
            exit 1
          fi

      - name: カレンダー更新（未来の開催日取得のため）
        run: node scripts/scrape_calendar.js $(date +%Y)

      - name: 次の開催日を特定
        id: dates
        run: |
          DATES=$(node scripts/get_next_dates.js | tr '\n' ' ' | xargs)
          echo "dates=$DATES" >> $GITHUB_OUTPUT
          echo "対象日: $DATES"

      - name: 出馬表スクレイピング
        env:
          DATES: ${{ steps.dates.outputs.dates }}
        run: |
          for DATE in $DATES; do
            node scripts/scrape_shutuba.js "$DATE"
          done

      - name: 出馬表データ生成
        env:
          DATES: ${{ steps.dates.outputs.dates }}
        run: node scripts/build_shutuba_data.js --date $DATES

      - name: Git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${REPO}"
          git add docs/ kaisai_calendar.json
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "出馬表更新 $(date +%Y%m%d)"
            git push origin HEAD:main || (git fetch origin main && git rebase origin/main && git push origin HEAD:main)
          fi
